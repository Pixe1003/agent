{{- if .Values.agentAiops.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent-aiops
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-aiops") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent-aiops
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-aiops") | nindent 4 }}
spec:
  replicas: {{ .Values.agentAiops.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: agent-aiops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: agent-aiops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ .Release.Name }}-agent-aiops
      {{- include "agent-infra.podSecurityContext" . | nindent 6 }}
      containers:
        - name: agent-aiops
          image: {{ include "agent-infra.image" (dict "root" . "repo" .Values.agentAiops.image.repository "tag" .Values.agentAiops.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.agentAiops.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.agentAiops.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent-aiops
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-aiops") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: agent-aiops
{{- end }}
