{{- if .Values.mcpServer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "mcp-server") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "mcp-server") | nindent 4 }}
spec:
  replicas: {{ .Values.mcpServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: {{ .Release.Name }}-mcp-server
      {{- include "agent-infra.podSecurityContext" . | nindent 6 }}
      containers:
        - name: mcp-server
          image: {{ include "agent-infra.image" (dict "root" . "repo" .Values.mcpServer.image.repository "tag" .Values.mcpServer.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MULTI_AGENT_URL
              value: "http://{{ .Release.Name }}-multi-agent:8080"
            - name: MEMORY_URL
              value: "http://{{ .Release.Name }}-agent-memory:8080"
            - name: AIOPS_URL
              value: "http://{{ .Release.Name }}-agent-aiops:8080"
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "mcp-server") | nindent 4 }}
spec:
  type: {{ .Values.mcpServer.service.type }}
  ports:
    - port: {{ .Values.mcpServer.service.port }}
      targetPort: {{ .Values.mcpServer.service.port }}
      name: mcp
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: mcp-server
{{- if .Values.mcpServer.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "mcp-server") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.mcpServer.ingress.className }}
  rules:
    {{- range .Values.mcpServer.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-mcp-server
                port:
                  number: {{ $.Values.mcpServer.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
