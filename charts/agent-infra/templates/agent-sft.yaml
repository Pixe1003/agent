{{- if .Values.agentSft.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent-sft
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-sft") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-agent-sft-model
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-sft") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.agentSft.modelPVC.storageClass }}
  storageClassName: {{ .Values.agentSft.modelPVC.storageClass }}
  {{- else if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agentSft.modelPVC.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent-sft
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-sft") | nindent 4 }}
spec:
  replicas: {{ .Values.agentSft.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: agent-sft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: agent-sft
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ .Release.Name }}-agent-sft
      {{- include "agent-infra.podSecurityContext" . | nindent 6 }}
      {{- with .Values.agentSft.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentSft.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-sft
          image: {{ include "agent-infra.image" (dict "root" . "repo" .Values.agentSft.image.repository "tag" .Values.agentSft.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.agentSft.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: model
              mountPath: /var/lib/agent
          resources:
            {{- toYaml .Values.agentSft.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 60   # GGUF 加载需要时间
            periodSeconds: 10
            failureThreshold: 12      # 给 120s 加载窗口
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-agent-sft-model
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent-sft
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "agent-sft") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: agent-sft
{{- end }}
