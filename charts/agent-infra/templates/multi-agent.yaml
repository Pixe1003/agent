{{- if .Values.multiAgent.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-multi-agent
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "multi-agent") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-multi-agent
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "multi-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.multiAgent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: multi-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: multi-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ .Release.Name }}-multi-agent
      {{- include "agent-infra.podSecurityContext" . | nindent 6 }}
      containers:
        - name: multi-agent
          image: {{ include "agent-infra.image" (dict "root" . "repo" .Values.multiAgent.image.repository "tag" .Values.multiAgent.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $k, $v := .Values.multiAgent.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.multiAgent.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-multi-agent
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "multi-agent") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: multi-agent
{{- if .Values.multiAgent.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-multi-agent
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "multi-agent") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-multi-agent
  minReplicas: {{ .Values.multiAgent.hpa.minReplicas }}
  maxReplicas: {{ .Values.multiAgent.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.multiAgent.hpa.targetCPU }}
{{- end }}
{{- if and .Values.observability.prometheus.enabled .Values.observability.prometheus.serviceMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-multi-agent
  labels:
    {{- include "agent-infra.componentLabels" (dict "root" . "component" "multi-agent") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: multi-agent
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.prometheus.scrapeInterval }}
{{- end }}
{{- end }}
